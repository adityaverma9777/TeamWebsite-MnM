<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manitya | MnM</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&f[]=commit-mono@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #08080a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --muted: #8e8e93;
      --lime: #c8ff00;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px;
    }
    .background-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .manitya-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      padding: 48px 36px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(200, 255, 0, 0.08);
      border: 1px solid rgba(200, 255, 0, 0.25);
      font-family: 'Commit Mono', monospace;
      font-size: 11px;
      color: var(--lime);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 8px var(--lime);
    }
    h1 {
      font-family: 'Clash Display', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    h1 span {
      color: var(--lime);
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto 32px;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: #ffffff;
      color: #08080a;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 999px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .home-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="background-grid"></div>
  <main class="manitya-container">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Route Initialized</span>
    </div>
    <h1>Manitya<span>.</span></h1>
    <p>The workspace for /manitya is ready. Tell me what you'd like to build here.</p>
    <a href="/" class="home-link">Back to Home →</a>
  </main>
</body>
</html>
