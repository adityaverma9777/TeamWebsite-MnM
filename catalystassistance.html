<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Catalyst AI Assistant | PromptWars × Catalyst</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commit+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #0b0f17;
  --card-bg: #111726;
  --card-user: #ea281e;
  --border: rgba(255,255,255,0.08);
  --border-focus: #ea281e;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --accent-red: #ea281e;
  --green: #25D366;
  --font-heading: 'Clash Display',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body: 'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono: 'Commit Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background-color:var(--bg);color:var(--text-main);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
.app-layout{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:860px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--bg);}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 1.25rem;border-bottom:1px solid var(--border);background:rgba(11,15,23,0.9);backdrop-filter:blur(12px);flex-shrink:0;z-index:10;}
.header-brand{display:flex;align-items:center;gap:0.75rem;text-decoration:none;color:var(--text-main);}
.brand-logo{height:26px;width:auto;display:block;}
.brand-title-wrap{display:flex;align-items:center;gap:8px;}
.brand-title{font-family:var(--font-heading);font-size:1.05rem;font-weight:600;letter-spacing:-0.01em;}
.online-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;background:rgba(37,211,102,0.12);border:1px solid rgba(37,211,102,0.3);border-radius:999px;font-family:var(--font-mono);font-size:0.68rem;color:var(--green);font-weight:600;}
.online-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse-dot 2s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.4;}}
.btn-header-link{font-size:0.82rem;color:var(--text-muted);text-decoration:none;padding:5px 10px;border-radius:6px;border:1px solid var(--border);transition:color 0.15s,border-color 0.15s;}
.btn-header-link:hover{color:var(--text-main);border-color:rgba(255,255,255,0.2);}
.messages-container{flex:1;overflow-y:auto;padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1rem;scroll-behavior:smooth;}
.messages-container::-webkit-scrollbar{width:5px;}
.messages-container::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:4px;}
.message-row{display:flex;width:100%;gap:0.65rem;}
.message-row.user{justify-content:flex-end;}
.message-row.assistant{justify-content:flex-start;}
.assistant-avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#ea281e 0%,#b91c1c 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;color:#fff;}
.bubble{max-width:82%;padding:0.75rem 1rem;border-radius:14px;font-size:0.925rem;line-height:1.65;word-break:break-word;}
.message-row.user .bubble{background:var(--card-user);color:#fff;border-radius:14px 14px 4px 14px;}
.message-row.assistant .bubble{background:var(--card-bg);border:1px solid var(--border);border-radius:4px 14px 14px 14px;color:var(--text-main);}
.bubble p{margin-bottom:0.5rem;}
.bubble p:last-child{margin-bottom:0;}
.bubble strong{color:#fff;font-weight:600;}
.bubble code{font-family:var(--font-mono);font-size:0.82em;background:rgba(255,255,255,0.08);padding:2px 5px;border-radius:4px;}
.bubble a{color:#60a5fa;text-decoration:underline;text-underline-offset:3px;}
.bubble a:hover{color:#93c5fd;}
.typing-indicator{display:none;align-items:center;gap:0.65rem;}
.typing-indicator.visible{display:flex;}
.typing-bubbles{display:flex;align-items:center;gap:5px;background:var(--card-bg);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:0.75rem 1rem;}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--text-subtle);animation:bounce 1.3s infinite ease-in-out;}
.typing-dot:nth-child(2){animation-delay:0.18s;}
.typing-dot:nth-child(3){animation-delay:0.36s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
.welcome-block{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2.5rem 1.5rem 1.5rem;gap:1.25rem;}
.welcome-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#ea281e 0%,#b91c1c 100%);display:flex;align-items:center;justify-content:center;color:#fff;}
.welcome-title{font-family:var(--font-heading);font-size:1.35rem;font-weight:600;letter-spacing:-0.02em;}
.welcome-sub{font-size:0.9rem;color:var(--text-muted);max-width:380px;line-height:1.6;}
.chips-grid{display:flex;flex-wrap:wrap;gap:0.55rem;justify-content:center;max-width:500px;}
.suggestion-chip{display:inline-flex;align-items:center;gap:6px;padding:0.45rem 0.85rem;background:var(--card-bg);border:1px solid var(--border);border-radius:999px;font-size:0.82rem;color:var(--text-muted);cursor:pointer;transition:all 0.15s;font-family:var(--font-body);}
.suggestion-chip:hover{border-color:var(--accent-red);color:var(--text-main);background:rgba(234,40,30,0.08);}
.input-area{padding:0.85rem 1rem 1rem;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.input-form{display:flex;gap:0.65rem;align-items:flex-end;}
.input-wrap{flex:1;position:relative;}
#userInput{width:100%;resize:none;overflow:hidden;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:0.75rem 1rem;color:var(--text-main);font-family:var(--font-body);font-size:0.925rem;line-height:1.5;outline:none;transition:border-color 0.15s;min-height:46px;max-height:160px;}
#userInput::placeholder{color:var(--text-subtle);}
#userInput:focus{border-color:var(--border-focus);}
.btn-send{width:44px;height:44px;border-radius:12px;background:var(--accent-red);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity 0.15s,transform 0.1s;align-self:flex-end;}
.btn-send:hover:not(:disabled){opacity:0.88;}
.btn-send:active:not(:disabled){transform:scale(0.95);}
.btn-send:disabled{opacity:0.4;cursor:not-allowed;}
.input-hint{font-size:0.75rem;color:var(--text-subtle);margin-top:0.5rem;text-align:center;}
@media(max-width:600px){
  .app-layout{border-left:none;border-right:none;}
  .chat-header{padding:0.75rem 1rem;}
  .brand-title{font-size:0.95rem;}
  .messages-container{padding:1rem 0.75rem;}
  .bubble{max-width:90%;font-size:0.9rem;}
  .welcome-block{padding:2rem 1rem 1.25rem;}
  .welcome-title{font-size:1.2rem;}
  .input-area{padding:0.75rem 0.75rem 0.9rem;}
}
@media(prefers-reduced-motion:reduce){
  .typing-dot,.online-dot{animation:none;}
}
</style>
</head>
<body>
<div class="app-layout">
  <header class="chat-header">
    <a href="/" class="header-brand">
      <img src="/logo.png" alt="MnM" class="brand-logo">
      <div class="brand-title-wrap">
        <span class="brand-title">Catalyst Assistant</span>
        <span class="online-badge"><span class="online-dot"></span>Online</span>
      </div>
    </a>
    <a href="/catalyst.html" class="btn-header-link">Event Page</a>
  </header>
  <div class="messages-container" id="messagesContainer">
    <div class="welcome-block" id="welcomeBlock">
      <div class="welcome-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      </div>
      <div>
        <div class="welcome-title">PromptWars × Catalyst AI</div>
        <p class="welcome-sub">Ask me anything about the Catalyst hackathon — schedule, prizes, submission, verification, and more.</p>
      </div>
      <div class="chips-grid">
        <button class="suggestion-chip" data-query="When does the hackathon start?">📅 Event timeline</button>
        <button class="suggestion-chip" data-query="What are the submission requirements?">📦 Submission details</button>
        <button class="suggestion-chip" data-query="What prizes can I win?">🏆 Prizes & rewards</button>
        <button class="suggestion-chip" data-query="How do I get the Adaption AI credits?">💳 Adaption credits</button>
        <button class="suggestion-chip" data-query="My name is not on the verify list, what should I do?">🔍 Name missing?</button>
        <button class="suggestion-chip" data-query="How will judging work?">⚖️ Judging criteria</button>
      </div>
    </div>
    <div class="typing-indicator" id="typingIndicator">
      <div class="assistant-avatar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      </div>
      <div class="typing-bubbles">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
    </div>
  </div>
  <div class="input-area">
    <form class="input-form" id="chatForm">
      <div class="input-wrap">
        <textarea id="userInput" placeholder="Ask about the hackathon…" rows="1" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      </div>
      <button type="submit" class="btn-send" id="btnSend" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </form>
    <p class="input-hint">Only answers questions about PromptWars × Catalyst</p>
  </div>
</div>
<script>
(function() {
  const messagesContainer = document.getElementById('messagesContainer');
  const welcomeBlock = document.getElementById('welcomeBlock');
  const typingIndicator = document.getElementById('typingIndicator');
  const chatForm = document.getElementById('chatForm');
  const userInput = document.getElementById('userInput');
  const btnSend = document.getElementById('btnSend');
  let chatHistory = [];
  let isWelcomeVisible = true;
  userInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  });
  userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      chatForm.dispatchEvent(new Event('submit'));
    }
  });
  function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }
  function formatMarkdown(text) {
    let t = (text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(https?:\/\/[^\s<"]+)/g, function(url) {
        if (t.includes('href="' + url)) return url;
        return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
      });
    return t.split('\n\n').map(function(p) {
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }
  function appendMessage(role, content) {
    if (isWelcomeVisible) {
      welcomeBlock.style.display = 'none';
      isWelcomeVisible = false;
    }
    const row = document.createElement('div');
    row.className = 'message-row ' + role;
    if (role === 'assistant') {
      const avatar = document.createElement('div');
      avatar.className = 'assistant-avatar';
      avatar.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>';
      row.appendChild(avatar);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'assistant') {
      bubble.innerHTML = formatMarkdown(content);
    } else {
      bubble.textContent = content;
    }
    row.appendChild(bubble);
    messagesContainer.insertBefore(row, typingIndicator);
    scrollToBottom();
  }
  async function sendMessage(promptText) {
    chatHistory.push({ role: 'user', content: promptText });
    typingIndicator.classList.add('visible');
    btnSend.disabled = true;
    scrollToBottom();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chatHistory })
      });
      const data = await res.json();
      typingIndicator.classList.remove('visible');
      if (res.status === 429) {
        appendMessage('assistant', '⏳ You\'re sending messages too fast. Please wait a moment and try again.');
        chatHistory.pop();
        btnSend.disabled = false;
        userInput.focus();
        return;
      }
      if (!res.ok || data.error) {
        appendMessage('assistant', '⚠️ ' + (data.error || 'Something went wrong. Please try again.'));
        chatHistory.pop();
        btnSend.disabled = false;
        userInput.focus();
        return;
      }
      const reply = data.reply || 'No response. Please try again.';
      chatHistory.push({ role: 'assistant', content: reply });
      appendMessage('assistant', reply);
    } catch {
      typingIndicator.classList.remove('visible');
      appendMessage('assistant', '⚠️ Network error. Please check your connection and try again.');
      chatHistory.pop();
    } finally {
      btnSend.disabled = false;
      userInput.focus();
    }
  }
  chatForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const text = userInput.value.trim();
    if (!text || btnSend.disabled) return;
    userInput.value = '';
    userInput.style.height = 'auto';
    appendMessage('user', text);
    sendMessage(text);
  });
  document.addEventListener('click', function(e) {
    const chip = e.target.closest('.suggestion-chip');
    if (!chip) return;
    const q = chip.getAttribute('data-query');
    if (!q) return;
    appendMessage('user', q);
    sendMessage(q);
  });
})();
</script>
</body>
</html>
